apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    k8s-app: cilium-agent-pods
  name: cilium-agent-pods
  namespace: monitoring
spec:
  podMetricsEndpoints:
    - interval: 10s
      port: prometheus
  jobLabel: k8s-app
  selector:
    matchLabels:
      k8s-app: cilium
  namespaceSelector:
    matchNames:
      - kube-system
